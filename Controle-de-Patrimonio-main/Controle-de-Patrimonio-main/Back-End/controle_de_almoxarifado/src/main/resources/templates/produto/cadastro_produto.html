<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${produto.id == null ? 'Cadastrar Produto - Almax' : 'Editar Produto - Almax'}">
        Cadastrar Produto - Almax
    </title>

    <style>

        /* =========================================================
           ALMAX - DESIGN SYSTEM
           ========================================================= */

        :root {
            --almax-bg: #121212;
            --almax-bg-secondary: #1A1A1A;
            --almax-card: #1C1C1C;

            --almax-border: #262626;
            --almax-border-light: #333333;
            --almax-border-input: #444444;

            --almax-accent: #FF6B00;
            --almax-accent-hover: #E05E00;
            --almax-accent-soft: rgba(255, 107, 0, 0.10);

            --almax-text: #FFFFFF;
            --almax-text-primary: #E0E0E0;
            --almax-text-secondary: #A8A8A8;
            --almax-text-muted: #7C7C7C;

            --almax-danger: #E74C3C;
        }


        /* =========================================================
           RESET
           ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =========================================================
           BODY
           ========================================================= */

        body {
            background-color: var(--almax-bg);

            color: var(--almax-text);

            font-family:
                    'Segoe UI',
                    Tahoma,
                    Geneva,
                    Verdana,
                    sans-serif;

            min-height: 100vh;

            display: flex;
            flex-direction: column;
        }


        /* =========================================================
           CONTAINER
           ========================================================= */

        .main-container {
            flex: 1;

            width: 100%;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding: 2.5rem 1.5rem 3rem;
        }


        /* =========================================================
           CARD
           ========================================================= */

        .card {
            width: 100%;
            max-width: 650px;

            background-color: var(--almax-card);

            border: 1px solid var(--almax-border);

            border-radius: 8px;

            padding: 2rem;

            box-shadow:
                    0 12px 30px rgba(0, 0, 0, 0.30);

            position: relative;

            overflow: hidden;
        }


        /* =========================================================
           BARRA SUPERIOR
           ========================================================= */

        .card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: 4px;

            background-color: var(--almax-accent);
        }


        /* =========================================================
           CABEÇALHO
           ========================================================= */

        .card-header {
            display: flex;
            align-items: center;

            gap: 1rem;

            padding-bottom: 1.25rem;

            margin-bottom: 1.75rem;

            border-bottom: 1px solid var(--almax-border);
        }


        /* =========================================================
           ÍCONE
           ========================================================= */

        .card-header .icon {
            width: 46px;
            height: 46px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background-color: var(--almax-accent-soft);

            color: var(--almax-accent);

            border: 1px solid rgba(255, 107, 0, 0.20);

            border-radius: 7px;
        }


        .card-header .icon svg {
            width: 24px;
            height: 24px;
        }


        /* =========================================================
           TÍTULO
           ========================================================= */

        .card-header h1 {
            color: var(--almax-text);

            font-size: 1.45rem;

            font-weight: 700;

            line-height: 1.25;
        }


        .card-header p {
            color: var(--almax-text-secondary);

            font-size: 0.85rem;

            margin-top: 0.3rem;

            line-height: 1.4;
        }


        /* =========================================================
           FORMULÁRIO
           ========================================================= */

        .form-group {
            display: flex;

            flex-direction: column;

            margin-bottom: 1.4rem;
        }


        /* =========================================================
           LABEL
           ========================================================= */

        label {
            color: var(--almax-text-primary);

            font-size: 0.85rem;

            font-weight: 600;

            margin-bottom: 0.5rem;
        }


        /* =========================================================
           INPUTS
           ========================================================= */

        input[type="text"],
        textarea,
        select {

            width: 100%;

            background-color: var(--almax-bg);

            border: 1px solid var(--almax-border-input);

            border-radius: 5px;

            color: var(--almax-text);

            padding: 0.7rem 0.85rem;

            font-family:
                    'Segoe UI',
                    Tahoma,
                    Geneva,
                    Verdana,
                    sans-serif;

            font-size: 0.88rem;

            outline: none;

            transition:
                    border-color 0.15s ease,
                    box-shadow 0.15s ease,
                    background-color 0.15s ease;
        }


        input[type="text"] {
            min-height: 44px;
        }


        textarea {
            min-height: 120px;

            resize: vertical;

            line-height: 1.5;
        }


        /* =========================================================
           PLACEHOLDER
           ========================================================= */

        input::placeholder,
        textarea::placeholder {

            color: #5F5F5F;
        }


        /* =========================================================
           HOVER
           ========================================================= */

        input[type="text"]:hover,
        textarea:hover,
        select:hover {

            border-color: #555555;
        }


        /* =========================================================
           FOCUS
           ========================================================= */

        input[type="text"]:focus,
        textarea:focus,
        select:focus {

            background-color: #151515;

            border-color: var(--almax-accent);

            box-shadow:
                    0 0 0 2px rgba(255, 107, 0, 0.14);
        }


        /* =========================================================
           SELECT
           ========================================================= */

        select {
            min-height: 44px;

            cursor: pointer;
        }


        select option {
            background-color: var(--almax-bg);

            color: var(--almax-text);
        }


        /* =========================================================
           ERROS
           ========================================================= */

        .error {
            display: block;

            color: var(--almax-danger);

            font-size: 0.78rem;

            margin-top: 0.45rem;

            font-weight: 600;

            line-height: 1.4;
        }


        /* =========================================================
           INFORMAÇÃO
           ========================================================= */

        .info-box {
            display: flex;
            align-items: flex-start;

            gap: 0.9rem;

            margin-top: 0.25rem;

            margin-bottom: 1.75rem;

            padding: 1rem;

            background-color: var(--almax-accent-soft);

            border: 1px dashed rgba(255, 107, 0, 0.45);

            border-radius: 6px;
        }


        /* =========================================================
           ÍCONE INFORMAÇÃO
           ========================================================= */

        .info-icon {
            width: 30px;
            height: 30px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background-color: var(--almax-accent);

            color: #121212;

            border-radius: 50%;

            font-size: 0.85rem;

            font-weight: 800;
        }


        /* =========================================================
           TEXTO INFORMAÇÃO
           ========================================================= */

        .info-box strong {
            display: block;

            color: var(--almax-text);

            font-size: 0.85rem;

            font-weight: 600;

            margin-bottom: 0.25rem;
        }


        .info-box p {
            color: #BDBDBD;

            font-size: 0.78rem;

            line-height: 1.45;
        }


        /* =========================================================
           AÇÕES
           ========================================================= */

        .form-actions {
            display: flex;

            justify-content: flex-end;

            align-items: center;

            gap: 0.75rem;

            padding-top: 0.25rem;
        }


        /* =========================================================
           BOTÃO BASE
           ========================================================= */

        .btn {
            min-height: 40px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 0.6rem 1.15rem;

            border-radius: 5px;

            font-size: 0.83rem;

            font-weight: 600;

            text-decoration: none;

            cursor: pointer;

            transition:
                    background-color 0.15s ease,
                    border-color 0.15s ease,
                    color 0.15s ease,
                    transform 0.15s ease;
        }


        /* =========================================================
           CANCELAR
           ========================================================= */

        .btn-cancelar {
            background-color: transparent;

            color: var(--almax-text-secondary);

            border: 1px solid var(--almax-border-input);
        }


        .btn-cancelar:hover {
            background-color: #242424;

            color: var(--almax-text);

            border-color: #666666;

            transform: translateY(-1px);
        }


        /* =========================================================
           SALVAR
           ========================================================= */

        .btn-salvar {
            background-color: var(--almax-accent);

            color: #121212;

            border: 1px solid var(--almax-accent);
        }


        .btn-salvar:hover {
            background-color: var(--almax-accent-hover);

            border-color: var(--almax-accent-hover);

            color: #FFFFFF;

            transform: translateY(-1px);
        }


        /* =========================================================
           ÍCONE DO BOTÃO
           ========================================================= */

        .btn svg {
            width: 16px;
            height: 16px;

            margin-right: 0.4rem;
        }


        /* =========================================================
           ACESSIBILIDADE
           ========================================================= */

        .btn:focus-visible,
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible {

            outline: 2px solid var(--almax-accent);

            outline-offset: 2px;
        }


        /* =========================================================
           RESPONSIVIDADE
           ========================================================= */

        @media (max-width: 700px) {

            .main-container {
                padding:
                        1.5rem 1rem 2.5rem;
            }


            .card {
                padding: 1.5rem;
            }


            .card-header {
                align-items: flex-start;
            }


            .card-header h1 {
                font-size: 1.25rem;
            }


            .form-actions {
                flex-direction: column-reverse;

                align-items: stretch;
            }


            .btn {
                width: 100%;
            }

        }


        @media (max-width: 480px) {

            .main-container {
                padding:
                        1.25rem 0.75rem 2rem;
            }


            .card {
                padding: 1.25rem;
            }


            .card-header {
                gap: 0.75rem;
            }


            .card-header .icon {
                width: 40px;
                height: 40px;
            }


            .card-header .icon svg {
                width: 20px;
                height: 20px;
            }


            .info-box {
                gap: 0.7rem;

                padding: 0.85rem;
            }

        }


        /* =========================================================
           REDUÇÃO DE MOVIMENTO
           ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            .btn,
            input,
            textarea,
            select {

                transition: none;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     NAVBAR
     ========================================================= -->

<div th:replace="~{fragments/navbar :: navbar}"></div>


<!-- =========================================================
     CONTEÚDO PRINCIPAL
     ========================================================= -->

<main class="main-container">


    <div class="card">


        <!-- =====================================================
             CABEÇALHO
             ===================================================== -->

        <div class="card-header">


            <!-- ÍCONE DE PRODUTO -->

            <div class="icon">

                <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                    <path d="M3.5 7 L12 3 L20.5 7 L12 11 Z"/>

                    <path d="M3.5 7 L3.5 17 L12 21 L20.5 17 L20.5 7"/>

                    <path d="M12 11 L12 21"/>

                </svg>

            </div>


            <div>

                <h1
                        th:text="${produto.id == null ? 'Cadastrar Produto' : 'Editar Produto'}">

                    Cadastrar Produto

                </h1>


                <p>
                    Informe os dados do produto do almoxarifado.
                </p>

            </div>


        </div>


        <!-- =====================================================
             FORMULÁRIO
             ===================================================== -->

        <form
                th:action="@{/produto/salvar}"
                th:object="${produto}"
                method="post">


            <!-- =================================================
                 ID PARA EDIÇÃO
                 ================================================= -->

            <input
                    type="hidden"
                    th:field="*{id}">


            <!-- =================================================
                 NOME
                 ================================================= -->

            <div class="form-group">

                <label for="nome">
                    Nome do produto
                </label>


                <input
                        type="text"
                        id="nome"
                        th:field="*{nome}"
                        placeholder="Ex: Parafuso sextavado"
                        required
                >


                <span
                        class="error"
                        th:if="${#fields.hasErrors('nome')}"
                        th:errors="*{nome}">
                </span>

            </div>


            <!-- =================================================
                 DESCRIÇÃO
                 ================================================= -->

            <div class="form-group">

                <label for="descricao">
                    Descrição
                </label>


                <textarea
                        id="descricao"
                        th:field="*{descricao}"
                        placeholder="Informe uma descrição do produto..."
                        rows="5">
                </textarea>


                <span
                        class="error"
                        th:if="${#fields.hasErrors('descricao')}"
                        th:errors="*{descricao}">
                </span>

            </div>


            <!-- =================================================
                 CATEGORIA
                 ================================================= -->

            <div class="form-group">

                <label for="categoria">
                    Categoria
                </label>


                <input
                        type="text"
                        id="categoria"
                        th:field="*{categoria}"
                        placeholder="Ex: Ferramentas"
                        required
                >


                <span
                        class="error"
                        th:if="${#fields.hasErrors('categoria')}"
                        th:errors="*{categoria}">
                </span>

            </div>


            <!-- =================================================
                 CÓDIGO DE PATRIMÔNIO
                 ================================================= -->

            <div class="form-group">

                <label for="codigoPatrimonio">
                    Código de patrimônio
                </label>


                <input
                        type="text"
                        id="codigoPatrimonio"
                        th:field="*{codigoPatrimonio}"
                        placeholder="Ex: PAT-2026-001"
                        required
                >


                <span
                        class="error"
                        th:if="${#fields.hasErrors('codigoPatrimonio')}"
                        th:errors="*{codigoPatrimonio}">
                </span>

            </div>


            <!-- =================================================
                 LOCALIZAÇÃO
                 ================================================= -->

            <div class="form-group">

                <label for="localizacao">
                    Localização do produto
                </label>


                <input
                        type="text"
                        id="localizacao"
                        th:field="*{localizacao}"
                        placeholder="Ex: Corredor A - Estante 03"
                        required
                >


                <span
                        class="error"
                        th:if="${#fields.hasErrors('localizacao')}"
                        th:errors="*{localizacao}">
                </span>

            </div>


            <!-- =================================================
                 STATUS
                 ================================================= -->

            <div class="form-group">

                <label for="status">
                    Status do produto
                </label>


                <select
                        id="status"
                        th:field="*{status}"
                        required>

                    <option value="">
                        Selecione o status
                    </option>


                    <option
                            th:each="statusProduto : ${T(sp.senai.org.controle_de_almoxarifado.model.enums.StatusProduto).values()}"
                            th:value="${statusProduto}"
                            th:text="${statusProduto}">

                    </option>

                </select>


                <span
                        class="error"
                        th:if="${#fields.hasErrors('status')}"
                        th:errors="*{status}">
                </span>

            </div>


            <!-- =================================================
                 INFORMAÇÃO COMPLEMENTAR
                 ================================================= -->

            <div class="info-box">


                <div class="info-icon">
                    i
                </div>


                <div>

                    <strong>
                        Informações complementares
                    </strong>


                    <p>
                        O estoque, a Tag RFID e o histórico de
                        movimentações são relacionados ao produto
                        separadamente pelo sistema.
                    </p>

                </div>

            </div>


            <!-- =================================================
                 BOTÕES
                 ================================================= -->

            <div class="form-actions">


                <a
                        th:href="@{/produto/listar}"
                        class="btn btn-cancelar">

                    Cancelar

                </a>


                <button
                        type="submit"
                        class="btn btn-salvar">

                    <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round">

                        <path
                                d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>

                        <path
                                d="M17 21v-8H7v8"/>

                        <path
                                d="M7 3v5h8"/>

                    </svg>

                    Salvar produto

                </button>


            </div>


        </form>


    </div>


</main>


<!-- =========================================================
     FOOTER
     ========================================================= -->

<div th:replace="~{fragments/footer :: footer}"></div>


</body>

</html>
