<!DOCTYPE html>

<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<div th:fragment="navbar">
    <style>

        /* =========================================================
           ALMAX NAVBAR
           ========================================================= */

        .almax-navbar {
            --nav-bg: #121212;
            --nav-surface: #1a1a1a;
            --nav-surface-hover: #202020;
            --nav-border: #292929;

            --nav-accent: #ff6b00;
            --nav-accent-hover: #e05e00;
            --nav-accent-soft: rgba(255, 107, 0, 0.11);

            --nav-text: #ffffff;
            --nav-text-muted: #a8a8a8;
            --nav-text-soft: #777777;

            position: sticky;
            top: 0;
            z-index: 1000;

            width: 100%;

            display: flex;
            align-items: center;

            min-height: 68px;

            padding: 0 2rem;

            background:
                    linear-gradient(
                            180deg,
                            #171717 0%,
                            #121212 100%
                    );

            border-bottom: 1px solid var(--nav-border);

            box-shadow:
                    0 1px 0 rgba(255, 107, 0, 0.25),
                    0 8px 30px rgba(0, 0, 0, 0.28);

            font-family:
                    'Segoe UI',
                    Tahoma,
                    Geneva,
                    Verdana,
                    sans-serif;
        }


        /* =========================================================
           CONTAINER
           ========================================================= */

        .almax-navbar-inner {
            width: 100%;
            max-width: 1400px;

            margin: 0 auto;

            display: flex;
            align-items: center;

            gap: 1.5rem;
        }


        /* =========================================================
           LOGO
           ========================================================= */

        .almax-navbar .brand-logo {
            display: flex;
            align-items: center;

            gap: 0.7rem;

            text-decoration: none;

            flex-shrink: 0;
        }


        .almax-navbar .brand-mark {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                    linear-gradient(
                            145deg,
                            #ff7a1a,
                            #d95300
                    );

            color: #121212;

            border-radius: 9px;

            box-shadow:
                    0 4px 14px rgba(255, 107, 0, 0.18);

            transition:
                    transform 0.18s ease,
                    box-shadow 0.18s ease;
        }


        .almax-navbar .brand-logo:hover .brand-mark {
            transform: translateY(-1px);

            box-shadow:
                    0 6px 18px rgba(255, 107, 0, 0.28);
        }


        .almax-navbar .brand-mark svg {
            width: 21px;
            height: 21px;
        }


        .almax-navbar .brand-text {
            display: flex;
            flex-direction: column;

            gap: 2px;
        }


        .almax-navbar .brand-name {
            color: var(--nav-text);

            font-size: 1.2rem;
            font-weight: 750;

            letter-spacing: 0.2px;

            line-height: 1;
        }


        .almax-navbar .brand-sub {
            color: var(--nav-accent);

            font-size: 0.58rem;
            font-weight: 700;

            letter-spacing: 2px;

            line-height: 1;
        }


        /* =========================================================
           SEPARADOR
           ========================================================= */

        .almax-navbar .nav-divider {
            width: 1px;
            height: 30px;

            background: var(--nav-border);

            flex-shrink: 0;
        }


        /* =========================================================
           MENU
           ========================================================= */

        .almax-navbar .nav-menu {
            list-style: none;

            display: flex;
            align-items: center;

            gap: 0.15rem;

            margin: 0;
            padding: 0;

            flex: 1;
        }


        .almax-navbar .nav-item {
            margin: 0;
            padding: 0;
        }


        .almax-navbar .nav-link {
            position: relative;

            display: inline-flex;
            align-items: center;

            gap: 0.45rem;

            min-height: 40px;

            padding: 0.55rem 0.75rem;

            color: var(--nav-text-muted);

            text-decoration: none;

            font-size: 0.84rem;
            font-weight: 550;

            border-radius: 7px;

            white-space: nowrap;

            transition:
                    color 0.16s ease,
                    background-color 0.16s ease;
        }


        .almax-navbar .nav-link svg {
            width: 17px;
            height: 17px;

            flex-shrink: 0;

            opacity: 0.8;

            transition:
                    opacity 0.16s ease,
                    transform 0.16s ease;
        }


        .almax-navbar .nav-link:hover {
            color: var(--nav-text);

            background-color:
                    var(--nav-surface-hover);
        }


        .almax-navbar .nav-link:hover svg {
            opacity: 1;

            transform: translateY(-1px);
        }


        /* Indicador inferior */

        .almax-navbar .nav-link::after {
            content: "";

            position: absolute;

            left: 0.7rem;
            right: 0.7rem;
            bottom: 2px;

            height: 2px;

            background: var(--nav-accent);

            border-radius: 99px;

            transform: scaleX(0);

            transform-origin: center;

            transition:
                    transform 0.18s ease;
        }


        .almax-navbar .nav-link:hover::after {
            transform: scaleX(0.7);
        }


        /* =========================================================
           LINK ATIVO

           Use class="active" no link da página atual.
           ========================================================= */

        .almax-navbar .nav-link.active {
            color: var(--nav-text);

            background-color:
                    var(--nav-accent-soft);
        }


        .almax-navbar .nav-link.active svg {
            color: var(--nav-accent);

            opacity: 1;
        }


        .almax-navbar .nav-link.active::after {
            transform: scaleX(1);
        }


        /* =========================================================
           AÇÕES DO USUÁRIO
           ========================================================= */

        .almax-navbar .nav-user {
            display: flex;
            align-items: center;

            gap: 0.5rem;

            flex-shrink: 0;
        }


        /* Usuários */

        .almax-navbar .btn-usuario {
            display: inline-flex;
            align-items: center;

            gap: 0.45rem;

            min-height: 38px;

            padding: 0.5rem 0.75rem;

            color: var(--nav-text-muted);

            text-decoration: none;

            font-size: 0.82rem;
            font-weight: 550;

            border: 1px solid var(--nav-border);

            background: transparent;

            border-radius: 7px;

            transition:
                    color 0.16s ease,
                    background-color 0.16s ease,
                    border-color 0.16s ease;
        }


        .almax-navbar .btn-usuario svg {
            width: 16px;
            height: 16px;
        }


        .almax-navbar .btn-usuario:hover {
            color: var(--nav-text);

            background-color: var(--nav-surface);

            border-color: #3a3a3a;
        }


        /* =========================================================
           LOGOUT
           ========================================================= */

        .almax-navbar .btn-logout {
            display: inline-flex;
            align-items: center;

            gap: 0.45rem;

            min-height: 38px;

            padding: 0.5rem 0.85rem;

            color: var(--nav-accent);

            text-decoration: none;

            font-size: 0.82rem;
            font-weight: 650;

            background: var(--nav-accent-soft);

            border: 1px solid rgba(255, 107, 0, 0.16);

            border-radius: 7px;

            transition:
                    color 0.16s ease,
                    background-color 0.16s ease,
                    border-color 0.16s ease,
                    transform 0.16s ease;
        }


        .almax-navbar .btn-logout svg {
            width: 16px;
            height: 16px;
        }


        .almax-navbar .btn-logout:hover {
            color: #121212;

            background: var(--nav-accent);

            border-color: var(--nav-accent);

            transform: translateY(-1px);
        }


        /* =========================================================
           RESPONSIVIDADE
           ========================================================= */

        @media (max-width: 1150px) {

            .almax-navbar {
                padding: 0 1.25rem;
            }

            .almax-navbar-inner {
                gap: 1rem;
            }

            .almax-navbar .nav-link {
                padding-left: 0.6rem;
                padding-right: 0.6rem;
            }

            .almax-navbar .nav-link span {
                font-size: 0.8rem;
            }
        }


        @media (max-width: 980px) {

            .almax-navbar {
                min-height: auto;

                padding:
                        0.75rem 1rem;
            }

            .almax-navbar-inner {
                flex-wrap: wrap;

                gap: 0.75rem;
            }

            .almax-navbar .nav-menu {
                order: 5;

                width: 100%;

                flex-basis: 100%;

                overflow-x: auto;

                padding-top: 0.7rem;

                border-top: 1px solid var(--nav-border);

                scrollbar-width: thin;
            }

            .almax-navbar .nav-menu::-webkit-scrollbar {
                height: 4px;
            }

            .almax-navbar .nav-link {
                flex-shrink: 0;
            }

            .almax-navbar .nav-divider {
                display: none;
            }

            .almax-navbar .nav-user {
                margin-left: auto;
            }
        }


        @media (max-width: 600px) {

            .almax-navbar {
                padding: 0.7rem 0.85rem;
            }

            .almax-navbar .brand-mark {
                width: 35px;
                height: 35px;
            }

            .almax-navbar .brand-mark svg {
                width: 19px;
                height: 19px;
            }

            .almax-navbar .brand-name {
                font-size: 1.1rem;
            }

            .almax-navbar .btn-usuario span,
            .almax-navbar .btn-logout span {
                display: none;
            }

            .almax-navbar .btn-usuario,
            .almax-navbar .btn-logout {
                width: 36px;
                height: 36px;

                padding: 0;

                justify-content: center;
            }

            .almax-navbar .nav-link {
                min-height: 38px;

                padding:
                        0.5rem 0.65rem;
            }
        }


        /* =========================================================
           ACESSIBILIDADE
           ========================================================= */

        .almax-navbar a:focus-visible {
            outline: 2px solid var(--nav-accent);

            outline-offset: 3px;
        }


        @media (prefers-reduced-motion: reduce) {

            .almax-navbar *,
            .almax-navbar *::after {
                transition: none !important;
            }
        }

    </style>


    <!-- =========================================================
         NAVBAR
         ========================================================= -->

                            <path d="M12.5 3.5 L20 11 L12 19 L4.5 11.5 L4.5 3.5 Z"/>

                <li class="nav-item">

            <!-- =================================================

            <div class="nav-user">

                    <svg

    </nav>

</div>

</html>
