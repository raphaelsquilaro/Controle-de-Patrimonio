<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${produto.id == null ? 'Cadastrar Produto' : 'Editar Produto'}">
        Cadastrar Produto
    </title>

    <link rel="stylesheet"
          th:href="@{/cadastro-produto.css}">

</head>

<body>

<div class="container">

    <div class="card">

        <!-- Cabeçalho -->
        <div class="card-header">

            <div class="icon">
                📦
            </div>

            <div>

                <h1 th:text="${produto.id == null ? 'Cadastrar Produto' : 'Editar Produto'}">
                    Cadastrar Produto
                </h1>

                <p>
                    Informe os dados do produto do almoxarifado.
                </p>

            </div>

        </div>


        <!-- Formulário -->
        <form th:action="@{/produto/salvar}"
              th:object="${produto}"
              method="post">

            <!-- ID para edição -->
            <input type="hidden"
                   th:field="*{id}">


            <!-- Nome -->
            <div class="form-group">

                <label for="nome">
                    Nome do produto
                </label>

                <input
                        type="text"
                        id="nome"
                        th:field="*{nome}"
                        placeholder="Ex: Parafuso sextavado"
                        required
                >

                <span
                        class="error"
                        th:if="${#fields.hasErrors('nome')}"
                        th:errors="*{nome}">
                </span>

            </div>


            <!-- Descrição -->
            <div class="form-group">

                <label for="descricao">
                    Descrição
                </label>

                <textarea
                        id="descricao"
                        th:field="*{descricao}"
                        placeholder="Informe uma descrição do produto..."
                        rows="5">
                </textarea>

                <span
                        class="error"
                        th:if="${#fields.hasErrors('descricao')}"
                        th:errors="*{descricao}">
                </span>

            </div>


            <!-- Categoria -->
            <div class="form-group">

                <label for="categoria">
                    Categoria
                </label>

                <input
                        type="text"
                        id="categoria"
                        th:field="*{categoria}"
                        placeholder="Ex: Ferramentas"
                        required
                >

                <span
                        class="error"
                        th:if="${#fields.hasErrors('categoria')}"
                        th:errors="*{categoria}">
                </span>

            </div>


            <!-- Status -->
            <div class="form-group">

                <label for="status">
                    Status do produto
                </label>

                <select
                        id="status"
                        th:field="*{status}"
                        required>

                    <option value="">
                        Selecione o status
                    </option>

                    <option
                            th:each="statusProduto : ${T(sp.senai.org.controle_de_almoxarifado.model.enums.StatusProduto).values()}"
                            th:value="${statusProduto}"
                            th:text="${statusProduto}">
                    </option>

                </select>

                <span
                        class="error"
                        th:if="${#fields.hasErrors('status')}"
                        th:errors="*{status}">
                </span>

            </div>


            <!-- Informação -->
            <div class="info-box">

                <div class="info-icon">
                    ℹ
                </div>

                <div>
                    <strong>Informação</strong>

                    <p>
                        O estoque e a Tag RFID serão associados
                        posteriormente ao produto.
                    </p>
                </div>

            </div>


            <!-- Botões -->
            <div class="form-actions">

                <a
                        th:href="@{/produto/listar}"
                        class="btn btn-cancelar">
                    Cancelar
                </a>

                <button
                        type="submit"
                        class="btn btn-salvar">
                    Salvar produto
                </button>

            </div>

        </form>

    </div>

</div>

</body>

</html>
