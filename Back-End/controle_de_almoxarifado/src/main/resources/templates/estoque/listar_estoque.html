<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Estoque - Almoxarifado</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Controle de Estoque</h2>
        <div>
            <!-- Botão de Voltar para a Home -->
            <a th:href="@{/}" class="btn btn-outline-secondary me-2">Voltar ao Menu</a>
            <!-- Botão de Cadastro -->
            <a th:href="@{/estoque/form-cadastro}" class="btn btn-primary">+ Novo Estoque</a>
        </div>
    </div>

    <!-- Mensagens de Alerta -->
    <div th:if="${mensagem}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensagem}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Tabela de Listagem -->
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID Estoque</th>
                    <th>ID Produto</th>
                    <th>Produto</th>
                    <th>Categoria</th>
                    <th>Quantidade</th>
                    <th class="text-center">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="est : ${estoques}">
                    <td th:text="${est.id}">1</td>
                    <td th:text="${est.produto != null ? est.produto.id : 'N/A'}">10</td>
                    <td th:text="${est.produto != null ? est.produto.nome : 'Sem Produto Associado'}">Parafuso</td>
                    <td th:text="${est.produto != null ? est.produto.categoria : '-'}">Ferragens</td>
                    <td>
                        <span th:text="${est.quantidade}"
                              th:classappend="${est.quantidade <= 5} ? 'badge bg-danger' : 'badge bg-success'">
                            100
                        </span>
                    </td>
                    <td class="text-center">
                        <!-- Botão Editar -->
                        <a th:href="@{/estoque/editar/{id}(id=${est.id})}" class="btn btn-warning btn-sm me-1">
                            Editar
                        </a>

                        <!-- Botão Excluir com confirmação -->
                        <a th:href="@{/estoque/excluir/{id}(id=${est.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Tem certeza que deseja excluir este registro de estoque?');">
                            Excluir
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(estoques)}">
                    <td colspan="6" class="text-center text-muted">Nenhum estoque cadastrado.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
