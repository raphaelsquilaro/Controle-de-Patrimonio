<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${leitorRFID.id == null ? 'Cadastrar Leitor RFID' : 'Editar Leitor RFID'}">
        Cadastrar Leitor RFID
    </title>

    <link rel="stylesheet" th:href="@{/leitor-rfid.css}">
</head>

<body>

<div class="container">

    <div class="card">

        <div class="card-header">
            <div class="icon">📡</div>

            <div>
                <h1 th:text="${leitorRFID.id == null ? 'Cadastrar Leitor RFID' : 'Editar Leitor RFID'}">
                    Cadastrar Leitor RFID
                </h1>

                <p>
                    Cadastre as informações do leitor RFID do almoxarifado.
                </p>
            </div>
        </div>

        <form th:action="@{/leitor/salvar}"
              th:object="${leitorRFID}"
              method="post">

            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="nome">Nome do leitor</label>

                <input
                        type="text"
                        id="nome"
                        th:field="*{nome}"
                        placeholder="Ex: Leitor RFID Entrada"
                        required
                >
            </div>

            <div class="form-group">
                <label for="localizacao">Localização</label>

                <input
                        type="text"
                        id="localizacao"
                        th:field="*{localizacao}"
                        placeholder="Ex: Entrada do Almoxarifado"
                        required
                >
            </div>

            <div class="form-group">
                <label for="online">Status</label>

                <select id="online" th:field="*{online}" required>
                    <option value="">Selecione o status</option>
                    <option value="true">Online</option>
                    <option value="false">Offline</option>
                </select>
            </div>

            <button type="submit">
                Salvar
            </button>

        </form>

    </div>

</div>

</body>
</html>
